version: "3.8"

services:
  web-app:
    build:
      context: .
      dockerfile: Dockerfile.app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production

  playwright-tests:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    environment:
      - BASE_URL=http://web-app:3000
    depends_on:
      web-app:
        condition: service_started
