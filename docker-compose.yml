services:
  postgres:
    image: postgres:16

    container_name: shopqa-db

    restart: always

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopqa

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web-app:
    build:
      context: .
      dockerfile: Dockerfile.app

    container_name: shopqa-web

    environment:
      NODE_ENV: production

      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/shopqa

      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      postgres:
        condition: service_healthy

  playwright-tests:
    build:
      context: .
      dockerfile: Dockerfile.e2e

    container_name: shopqa-e2e

    environment:
      BASE_URL: http://web-app:3000
      CI: "true"

    depends_on:
      - web-app

volumes:
  postgres_data:
