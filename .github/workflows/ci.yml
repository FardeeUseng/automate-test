name: CI Monorepo Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  unit-and-component-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js Environment
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn lint

      - name: Run Jest Testing
        run: yarn test:unit

  e2e-tests:
    needs: unit-and-component-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shopqa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shopqa
      JWT_SECRET: ci-test-secret-key-for-github-actions
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js Environment
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Generate Prisma Client
        run: yarn prisma generate

      - name: Push Database Schema
        run: yarn prisma db push --skip-generate

      - name: Build App
        run: yarn build

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Start App Server
        run: yarn start &

      - name: Wait for App to be Ready
        run: timeout 120 bash -c 'until curl -sf http://localhost:3000/api/health; do sleep 2; done'

      - name: Run E2E Tests
        run: yarn test:e2e

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
